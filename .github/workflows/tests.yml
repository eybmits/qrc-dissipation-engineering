name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Restore sealed test evidence
        run: |
          cd results
          sha256sum -c ARCHIVE_SHA256SUMS.txt
          sha256sum -c qrc_dissipation_reproducibility_package.zip.sha256
          cd ..
          mkdir -p "$RUNNER_TEMP/qrc-evidence"
          unzip -q results/qrc_dissipation_reproducibility_package.zip \
            -d "$RUNNER_TEMP/qrc-evidence"
          cp -R \
            "$RUNNER_TEMP/qrc-evidence/qrc_dissipation_revision_evidence/results/." \
            results/
          tar -xzf results/final_protocol_results.tar.gz -C results
          tar -xzf results/review_protocol_results.tar.gz -C results
      - name: Test
        env:
          PYTHONPATH: src:experiments
        run: python -m pytest -q
